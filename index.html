<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DPS統合版診断 v2.4</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EFE8;--bg2:#FAFAF8;--bg3:#EDEBE2;--bg4:#E5E2D8;
  --dark:#2C2C2A;--mid:#5F5E5A;--lit:#888780;
  --line:#DDDBD2;--gold:#C9A96E;--gold2:#8A6830;
  --teal:#1D9E75;--tl:#E1F5EE;
  --amb:#BA7517;--al:#FAEEDA;
  --red:#A32D2D;--rl:#FCEBEB;
  --blu:#185FA5;--bl:#E6F1FB;
  --text:var(--dark);--text2:var(--mid);--text3:var(--lit);
  --card:var(--bg2);--border:var(--line);--acc:var(--gold2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif;font-size:14px;line-height:1.75;min-height:100vh}
.screen{display:none;padding:24px 20px 80px;max-width:680px;margin:0 auto}
.cover-wrap{text-align:center;padding:40px 0 20px}
.cover-brand{font-size:10px;letter-spacing:.4em;color:var(--lit);margin-bottom:12px}
.cover-title{font-family:'Noto Serif JP',serif;font-size:26px;font-weight:600;color:var(--dark);line-height:1.4;margin-bottom:8px}
.cover-sub{font-size:11px;color:var(--lit);letter-spacing:.2em;margin-bottom:28px}
.cover-desc{font-size:13px;color:var(--mid);line-height:1.9;margin-bottom:28px;text-align:left;background:var(--bg3);padding:16px;border-left:3px solid var(--gold);border-radius:0 4px 4px 0}
.btn-start{background:var(--dark);color:var(--bg);border:none;font-size:13px;letter-spacing:.3em;padding:14px 40px;cursor:pointer;border-radius:4px;font-family:inherit;display:block;margin:0 auto}
.btn-start:hover{opacity:.85}
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.q-block-label{font-size:10px;letter-spacing:.3em;color:var(--gold2);font-weight:500}
.q-progress-wrap{flex:1;margin:0 12px;height:3px;background:var(--line);border-radius:2px}
.q-progress-bar{height:3px;background:var(--gold);border-radius:2px;transition:width .3s}
.q-progress-num{font-size:10px;color:var(--lit)}
.q-number{font-size:11px;font-weight:700;color:var(--gold2);margin-bottom:6px;letter-spacing:.1em}
.q-text{font-size:15px;font-weight:500;color:var(--dark);margin-bottom:16px;line-height:1.75}
.q-note{font-size:11px;color:var(--amb);margin-bottom:12px;padding:6px 10px;border-left:2px solid var(--amb);background:var(--al);line-height:1.6}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.choice{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;transition:all .15s;font-size:13px;color:var(--dark);line-height:1.6;display:flex;align-items:flex-start;gap:10px}
.choice:hover{border-color:var(--gold);background:var(--bg3)}
.choice.selected{border-color:var(--gold);background:var(--al)}
.choice-letter{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--lit)}
.choice.selected .choice-letter{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.nav{display:flex;justify-content:space-between;align-items:center}
.btn-nav{background:var(--dark);color:var(--bg);border:none;font-size:12px;letter-spacing:.2em;padding:10px 24px;cursor:pointer;border-radius:4px;font-family:inherit}
.btn-nav:disabled{opacity:.35;cursor:default}
.btn-nav.sec{background:transparent;border:1px solid var(--line);color:var(--mid)}
.r-type-badge{font-size:10px;letter-spacing:.3em;color:var(--gold2);margin-bottom:4px}
.r-type-name{font-family:'Noto Serif JP',serif;font-size:22px;font-weight:600;color:var(--dark);margin-bottom:4px}
.r-type-sub{font-size:12px;color:var(--mid);margin-bottom:16px}
.r-catch{font-size:16px;font-weight:500;color:var(--gold2);margin-bottom:16px;padding:10px 14px;border-left:3px solid var(--gold);background:var(--al);line-height:1.7}
.r-divider{height:1px;background:var(--line);margin:16px 0}
.persona-report{background:var(--bg3);border-radius:10px;padding:14px 16px;margin-bottom:4px;}
.persona-report-title{font-size:9px;letter-spacing:.2em;color:var(--lit);margin-bottom:8px;font-weight:500;}
.persona-report-body{font-size:12px;color:var(--dark);line-height:2.0;}
.persona-report-body strong{color:var(--mid);}
.persona-weak{margin-top:10px;padding:8px 10px;background:var(--bg4);border-left:2px solid var(--line);border-radius:4px;font-size:11px;color:var(--text3);line-height:1.8;}
.persona-p3{margin-top:10px;padding:8px 10px;background:var(--al);border-left:2px solid var(--amb);border-radius:4px;font-size:11px;color:var(--dark);line-height:1.8;}
.fb-block{margin-bottom:14px;padding:12px 14px;border-radius:6px}
.fb-base{background:var(--bg3)}
.fb-tips{background:var(--tl);border-left:3px solid var(--teal)}
.fb-warn{background:var(--rl);border-left:3px solid var(--red)}
.fb-label{font-size:10px;letter-spacing:.2em;color:var(--lit);margin-bottom:4px}
.fb-label-tips{font-size:10px;letter-spacing:.2em;color:var(--teal);margin-bottom:4px}
.fb-label-warn{font-size:10px;letter-spacing:.2em;color:var(--red);margin-bottom:4px}
.fb-body{font-size:13px;line-height:1.8;color:var(--dark)}
.scores-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.sc-card{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:10px 8px;text-align:center}
.sc-card.top{border-color:var(--gold)}
.sc-label{font-size:9px;color:var(--lit);margin-bottom:4px;line-height:1.4}
.sc-val{font-size:16px;font-weight:700;color:var(--dark)}
.sc-card.top .sc-val{color:var(--gold2)}
.ts-title{font-size:10px;letter-spacing:.3em;color:var(--gold2);margin-bottom:10px}
.ts-row{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.ts-phase{font-size:10px;font-weight:700;color:var(--lit);width:28px;flex-shrink:0;padding-top:2px}
.ts-body{font-size:12px;color:var(--dark);line-height:1.7}
.pos-wrap{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pos-item{display:flex;gap:10px;align-items:flex-start}
.pos-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.pos-icon-g{background:var(--tl);color:var(--teal)}
.pos-icon-b{background:var(--rl);color:var(--red)}
.pos-icon-n{background:var(--al);color:var(--amb)}
.pos-label{font-size:9px;color:var(--lit);margin-bottom:2px}
.pos-body{font-size:12px;color:var(--dark);line-height:1.65}
.shachi-box{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.s-title{font-size:10px;letter-spacing:.3em;color:var(--gold2);margin-bottom:8px}
.s-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.s-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.s-lbl{font-size:11px;color:var(--mid);flex:1}
.s-val{font-size:11px;font-weight:500}
.stress-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.stress-bar-wrap{flex:1;height:6px;background:var(--line);border-radius:3px}
.stress-bar{height:6px;background:var(--amb);border-radius:3px}
.stress-label{font-size:10px;color:var(--mid);width:90px;flex-shrink:0}
.stress-val{font-size:10px;color:var(--lit);width:20px;text-align:right}
.weak-flag{display:inline-block;background:var(--al);border:1px solid var(--amb);color:var(--amb);font-size:10px;padding:3px 8px;border-radius:12px;margin:3px 3px 3px 0}
.btn-pwd{background:transparent;border:1px solid var(--gold);color:var(--gold2);font-size:11px;letter-spacing:.2em;padding:10px 24px;cursor:pointer;border-radius:4px;font-family:inherit;display:block;margin:16px auto 0}
.btn-restart{background:transparent;border:1px solid var(--line);color:var(--mid);font-size:11px;letter-spacing:.2em;padding:8px 20px;cursor:pointer;border-radius:4px;font-family:inherit;display:block;margin:8px auto 0}
.pwd-wrap{text-align:center;padding:40px 0}
.pwd-title{font-size:13px;font-weight:500;color:var(--dark);margin-bottom:16px}
.pwd-input{background:var(--bg3);border:1px solid var(--line);color:var(--dark);font-size:14px;padding:10px 14px;width:100%;max-width:260px;border-radius:4px;outline:none;text-align:center;font-family:inherit;letter-spacing:.3em}
.pwd-input:focus{border-color:var(--gold)}
.btn-pwd-submit{background:var(--dark);color:var(--bg);border:none;font-size:12px;letter-spacing:.2em;padding:10px 28px;cursor:pointer;border-radius:4px;font-family:inherit;margin-top:12px}
.pwd-err{font-size:11px;color:var(--red);margin-top:8px;height:16px}
.ad-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ad-title{font-size:13px;font-weight:500;color:var(--gold2);letter-spacing:.1em}
.btn-close{background:transparent;border:1px solid var(--line);color:var(--mid);font-size:10px;padding:6px 14px;cursor:pointer;border-radius:4px;font-family:inherit}
.warn-box{background:var(--rl);border:1px solid var(--red);border-left:4px solid var(--red);border-radius:4px;padding:10px 14px;font-size:11px;color:var(--dark);line-height:1.75;margin-bottom:16px}
.ad-sec{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.ad-sec-title{font-size:10px;letter-spacing:.3em;color:var(--gold2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.j-box{border-radius:6px;padding:12px 14px;margin-bottom:8px}
.j-p1{background:var(--tl);border-left:3px solid var(--teal)}
.j-p2{background:var(--al);border-left:3px solid var(--amb)}
.j-p3{background:var(--rl);border-left:3px solid var(--red)}
.j-lbl{font-size:14px;font-weight:700;margin-bottom:4px}
.j-desc{font-size:11px;color:var(--mid);line-height:1.7}
.prof-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:4px}
.prof-card{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.prof-lbl{font-size:9px;color:var(--lit);margin-bottom:3px}
.prof-val{font-size:12px;font-weight:500;color:var(--dark)}
.flag-item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.flag-item:last-child{border-bottom:none}
.flag-icon{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;margin-top:1px}
.fw{background:var(--rl);color:var(--red)}
.fc{background:var(--al);color:var(--amb)}
.fi{background:var(--tl);color:var(--teal)}
.flag-name{font-size:11px;font-weight:500;color:var(--dark)}
.flag-desc{font-size:10px;color:var(--mid);line-height:1.6;margin-top:2px}
.act-title{font-size:10px;letter-spacing:.3em;color:var(--gold2);margin-bottom:8px}
.act-item{font-size:12px;color:var(--dark);padding:6px 0 6px 14px;position:relative;border-bottom:1px solid var(--line);line-height:1.6}
.act-item::before{content:'›';position:absolute;left:0;color:var(--gold)}
.send-box{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}
.send-title{font-size:10px;letter-spacing:.3em;color:var(--gold2);margin-bottom:10px}
.send-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.send-label{font-size:11px;color:var(--mid)}
.send-input{background:var(--bg3);border:1px solid var(--line);color:var(--dark);font-size:13px;padding:9px 12px;border-radius:4px;outline:none;font-family:inherit;width:100%}
.send-input:focus{border-color:var(--gold)}
.btn-send{background:var(--dark);color:var(--bg);border:none;font-size:12px;letter-spacing:.2em;padding:10px 28px;cursor:pointer;border-radius:4px;font-family:inherit;display:block;margin:0 auto}
.btn-send:disabled{opacity:.4;cursor:default}
.send-status{font-size:11px;margin-top:8px;text-align:center;min-height:16px}
.field-section{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.field-section-title{font-size:10px;letter-spacing:.3em;color:var(--gold2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.field-subtype-badge{display:inline-block;background:var(--al);border:1px solid var(--gold);color:var(--gold2);font-size:11px;font-weight:700;padding:4px 12px;border-radius:12px;margin-bottom:10px}
.field-block{margin-bottom:10px;padding:10px 12px;border-radius:6px;font-size:12px;line-height:1.8}
.field-block-g{background:var(--tl);border-left:3px solid var(--teal)}
.field-block-a{background:var(--al);border-left:3px solid var(--amb)}
.field-block-b{background:var(--bg3);border-left:3px solid var(--line)}
.field-block-label{font-size:9px;letter-spacing:.2em;color:var(--lit);margin-bottom:4px}
.field-block-label-g{font-size:9px;letter-spacing:.2em;color:var(--teal);margin-bottom:4px}
.field-block-label-a{font-size:9px;letter-spacing:.2em;color:var(--amb);margin-bottom:4px}
.field-fit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.field-fit-card{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.field-fit-lbl{font-size:9px;color:var(--lit);margin-bottom:2px}
.field-fit-val{font-size:11px;font-weight:700}
.fit-high{color:var(--teal)}
.fit-mid{color:var(--amb)}
.fit-low{color:var(--mid)}

/* ── 強化結果ブロック ── */
.enh-section{margin:12px 0;}
.enh-block{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--border);}
.enh-lbl{font-size:10px;font-weight:700;color:var(--mid);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.enh-body{font-size:12px;color:var(--dark);line-height:1.85;}
.enh-block.enh-reason{border-left:3px solid var(--teal);}
.enh-block.enh-high{border-left:3px solid var(--gold);}
.enh-block.enh-low{border-left:3px solid var(--mid);}
.enh-block.enh-tasks{border-left:3px solid var(--teal);}
.enh-block.enh-unsuitable{border-left:3px solid var(--amb);}
.enh-block.enh-step{border-left:3px solid var(--acc);}
.enh-task-list{list-style:none;padding:0;margin:4px 0 0;}
.enh-task-list li{padding:3px 0 3px 14px;position:relative;font-size:12px;color:var(--dark);line-height:1.7;}
.enh-task-list li::before{content:"▸";position:absolute;left:0;color:var(--teal);}
.enh-step-list{list-style:none;padding:0;margin:4px 0 0;}
.enh-step-list li{padding:4px 0 4px 14px;position:relative;font-size:12px;color:var(--dark);line-height:1.7;}
.enh-step-list li::before{content:"→";position:absolute;left:0;color:var(--acc);}

/* ── ストレス表示（本人向け改善版） ── */
.stress-row2{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.stress-row2:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.stress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.stress-label2{font-size:12px;font-weight:600;color:var(--dark);}
.stress-lv{font-size:11px;font-weight:700;letter-spacing:.03em;}
.stress-desc{font-size:11px;color:var(--text3);line-height:1.7;margin-top:5px;}

/* ── prof-card wide variant ── */
.prof-card-wide{grid-column:span 2;}
</style>
</head>
<body>
<div id="s-cover" class="screen" style="display:block">
  <div class="cover-wrap">
    <div class="cover-brand">SHACHI GROUP</div>
    <div class="cover-title">DPS統合版診断<br>v2.4</div>
    <div class="cover-sub">DIAGNOSTIC PLACEMENT SYSTEM</div>
    <div class="cover-desc">
      あなたの<strong>自然な傾向・役割適性・判断の癖・ストレス反応・成長タイプ</strong>を見つける診断です。<br>
      配置・育成の仮説を作るために使います。正直に、思ったままお答えください。<br>
      <span style="font-size:11px;color:var(--lit)">全45問 / 所要時間 約12〜18分</span>
    </div>
    <button class="btn-start" onclick="startQ()">診断をはじめる</button>
  </div>
</div>
<div id="s-q" class="screen">
  <div class="q-header">
    <div class="q-block-label" id="q-bl"></div>
    <div class="q-progress-wrap"><div class="q-progress-bar" id="q-bar"></div></div>
    <div class="q-progress-num" id="q-num"></div>
  </div>
  <div class="q-number" id="q-no"></div>
  <div class="q-text" id="q-tx"></div>
  <div id="q-note-wrap"></div>
  <div class="choices" id="q-choices"></div>
  <div class="nav">
    <button class="btn-nav sec" onclick="gBack()" id="btn-back">← 戻る</button>
    <button class="btn-nav" onclick="gNext()" id="btn-next" disabled>次へ →</button>
  </div>
</div>
<div id="s-result" class="screen">
  <div id="rpersona"></div>
  <div class="r-divider"></div>
  <div id="rcard"></div>
  <div class="r-divider"></div>
  <div id="rfield"></div>
  <div class="r-divider"></div>
  <div id="sgrid"></div>
  <div id="renhanced"></div>
  <div class="r-divider"></div>
  <div id="sbox"></div>
  <button class="btn-pwd" onclick="goPwd()">経営・上司向けレポートを見る</button>
  <button class="btn-restart" onclick="doRestart()">もう一度診断する</button>
  <div class="send-box">
    <div class="send-title">結果を送信する</div>
    <div style="font-size:11px;color:var(--mid);margin-bottom:10px;line-height:1.6">
      名前と店舗を入力して送信ボタンを押してください。<br>管理者のスプレッドシートに自動で記録されます。
    </div>
    <div class="send-row">
      <div class="send-label">氏名</div>
      <input class="send-input" id="send-name" placeholder="例：田中 翔" type="text">
    </div>
    <div class="send-row">
      <div class="send-label">店舗</div>
      <input class="send-input" id="send-store" placeholder="例：ジェネルー" type="text">
    </div>
    <button class="btn-send" onclick="sendResult()" id="btn-send">結果を送信する</button>
    <div class="send-status" id="send-status"></div>
  </div>
</div>
<div id="s-pwd" class="screen">
  <div class="pwd-wrap">
    <div class="pwd-title">経営・上司向けレポート<br>管理者パスワードを入力してください</div>
    <input type="password" class="pwd-input" id="pwd-in" placeholder="••••••••" onkeydown="if(event.key==='Enter')chkPwd()">
    <br>
    <button class="btn-pwd-submit" onclick="chkPwd()">確認する</button>
    <div class="pwd-err" id="pwd-err"></div>
    <button class="btn-restart sec" onclick="backRes()" style="margin-top:16px;background:transparent;border:1px solid var(--line);color:var(--mid);font-size:11px;padding:8px 20px;cursor:pointer;border-radius:4px;font-family:inherit">← 結果に戻る</button>
  </div>
</div>
<div id="s-admin" class="screen">
  <div class="ad-header">
    <div class="ad-title">経営・上司向けレポート</div>
    <button class="btn-close" onclick="backRes()">← 結果に戻る</button>
  </div>
  <div id="admcont"></div>
</div>
<script>
// ── SECTION A: 設定オブジェクト（DPS_CONFIG）──
// ⚠ このHTMLファイルはブラウザのソース表示で誰でも参照できます。
//   管理者パスワードのハッシュは「管理者レポートの表示ガード」専用です。
//   秘匿が必要な情報（判定ロジック・Webhook URLなど）はバックエンドに移行してください。
var DPS_CONFIG=(function(){
  // djb2-variant ハッシュ（表示制御のみ。秘匿情報の保護には使用しないこと）
  function _hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}return h;}
  var _adminHash=-1705737528;
  return{
    env:'test',  // 'test' → 'prod' に変更するだけでWebhookが切り替わります

  var str={REL:0,AMB:0,NUM_S:0,FREE:0,OVER:0};

    if(ch.a){
      if(NAT_IDX.indexOf(i)>=0) nat[ch.a]=(nat[ch.a]||0)+2;
      else if(CLM_IDX.indexOf(i)>=0) clm[ch.a]=(clm[ch.a]||0)+2;
      else if(SIM_IDX.indexOf(i)>=0) sim[ch.a]=(sim[ch.a]||0)+2;
    }
    if(ch.a2){
      if(NAT_IDX.indexOf(i)>=0) nat[ch.a2]=(nat[ch.a2]||0)+1;
      else if(CLM_IDX.indexOf(i)>=0) clm[ch.a2]=(clm[ch.a2]||0)+1;
    }
    if(ch.r&&STR_IDX.indexOf(i)<0){for(var rk in ch.r) rdir[rk]=(rdir[rk]||0)+ch.r[rk];}
    if(ch.r&&BBLOCK_IDX.indexOf(i)>=0){for(var rk in ch.r) rdirAspir[rk]=(rdirAspir[rk]||0)+ch.r[rk];}
    if(ch.st&&STR_IDX.indexOf(i)>=0) str[ch.st]=(str[ch.st]||0)+3;
    else if(ch.st&&STR_IDX.indexOf(i)<0) str[ch.st]=(str[ch.st]||0)+1;

  var simMax=Object.values(sim).reduce(function(a,b){return a+b;},0)||1;
  var crn={};for(var k in clm) crn[k]=clm[k]/clmMax;
  var srn={};for(var k in sim) srn[k]=sim[k]/simMax;
  var mix={};
  mix[N]=crn[N]*W.CLM_MIX+(srn[N]||0)*W.SIM_MIX;
  mix[B]=crn[B]*W.CLM_MIX+(srn[B]||0)*W.SIM_MIX;
  mix[C]=crn[C]*W.CLM_MIX+(srn[C]||0)*W.SIM_MIX;
  mix[D]=crn[D]*W.D_CLM+(srn[D]||0)*W.D_SIM;
  function convRole(ab){
    return{LEAD:ab[B]*2+ab[N],EDU:ab[N]*2+ab[B],
           NUM:ab[C]*2+ab[B],SYS:ab[C]*2+(ab[N]||0)*0.5,
           REC:ab[N]*2+(ab[D]||0)*0.5,PR:ab[D]*2+ab[C]};

  }

    var rd3=rdirN[rk]||0;
    var sm3=(simConv[rk]||0)/SM_CONV_MAX;
    roles[rk]=ab3*W.AB_CONV+rd3*W.RDIR_W+sm3*W.SIM_W;
  }
  var rn={};
  for(var rk in roles) rn[rk]=Math.min(100,Math.round(roles[rk]*100));
  var roles_raw={LEAD:clm[B]*2+clm[N],EDU:clm[N]*2+clm[B],NUM:clm[C]*2+clm[B],
                 SYS:clm[C]*2+clm[N]*0.5,REC:clm[N]*2+(clm[D]||0)*0.5,PR:(clm[D]||0)*2+clm[C]};
  var rawVals=Object.values(roles_raw).sort(function(a,b){return b-a;});
  var rawGap=rawVals[0]-rawVals[1];
  var sorted=[];
  for(var rk in rn) sorted.push([rk,rn[rk]]);

  var junType=false;
  if(!TYPES[typeKey]){var revKey=secKey+'-'+topKey;if(TYPES[revKey]) typeKey=revKey;else{junType=true;typeKey=null;}}
  var ntTop=topK(nat);var clTop=topK(clm);var simTop=topK(sim);

                        SYS:['現場後回し'],REC:['対人後回し','育成後回し'],PR:['数字後回し']};
    if(conflicts[topKey]&&conflicts[topKey].indexOf(wf)>=0) wfConflict=true;}
  // 志向スコア正規化（B-ブロック申告から抽出 ── 「やりたい役割」の参考値）

  var aspir={};for(var _ak in rdirAspir) aspir[_ak]=Math.round((rdirAspir[_ak]/_aspirMax)*100);

  else if(topScore>=T.P2_TOP&&scoreGap>=T.P2_GAP&&ef<=T.P2_EF_MAX){hantei=wfConflict?'P2W':'P2';}
  else{hantei='P3';}
  // 確信度目安（暫定式 ── 実績照合後に更新）
  var _ab=(clTop===simTop)?8:0; // 3層一致ボーナス（必須条件ではなく加点）
  var confidence=Math.min(90,Math.max(25,
    50+_ab+Math.min(18,scoreGap)+Math.max(0,topScore-55)-ef*4-(wfConflict?12:0)
  ));
  var lrnTop=topK(lrnMap);
  var sc={nat:nat,clm:clm,sim:sim,ntTop:ntTop,clTop:clTop,simTop:simTop,junType:junType,
          gap:gap,trust:trust,trustColor:trustColor,
          rn:rn,sorted:sorted,typeKey:typeKey,topKey:topKey,secKey:secKey,
          str:str,lrnTop:lrnTop,ea:ea,ef:ef,wf:wf,wfConflict:wfConflict,

// ── フィールドプロファイル関数群 ──
function detectFieldSubtype(sc){
  var rn=sc.rn,nat=sc.nat,cp=sc.cp||{};
  var leadScore=rn['LEAD']||0,eduScore=rn['EDU']||0,numScore=rn['NUM']||0;
  var sysScore=rn['SYS']||0,recScore=rn['REC']||0,prScore=rn['PR']||0;
  var nonLeadMax=Math.max(eduScore,numScore,sysScore,recScore,prScore);
  var sorted=sc.sorted,topKey=sc.topKey,simTop=sc.simTop;
  var topSc=sorted[0][1],secSc=sorted.length>1?sorted[1][1]:0,gap=topSc-secSc;
  var nNat=nat['対人']||0,bNat=nat['現場']||0;
  var cpPlayer=(cp.player||0)+(cp.after||0)+(cp.contact||0)+(cp.mood||0);
  var cpTeach=cp.teach||0;
  var cpMgmt=(cp.mgmt||0)+(cp.next||0)+(cp.sales||0);
  // ── 営業マネジメント転用候補（厳格化）──
  // PRトップは除外 / simTopが現場か対人必須 / topKeyはLEAD/NUM/SYSに限定
  var _simMgmt=(simTop==='現場'||simTop==='対人');
  var _topMgmt=(topKey==='LEAD'||topKey==='NUM'||topKey==='SYS');
  if(cpMgmt>=7&&leadScore>=45&&_simMgmt&&_topMgmt) return '営業マネジメント転用候補';
  // ── プレーヤー兼育成型（topKey問わず拾う）──
  // 客席でお客様への関係構築力＋後輩への伝達力がある場合
  // EDU/REC topKeyでも対象（客席対応ブロックの意図を結果に反映）
  var _cpRelation=(cp.trust||0)+(cp.crm||0)+(cp.next||0);
  if(cpTeach>=3&&_cpRelation>=5&&eduScore>=45) return 'プレーヤー兼育成型';
  // cpプレーヤー系優先判定（topKey問わず）
  if(cpPlayer>=6&&cpTeach>=3) return 'プレーヤー兼育成型';
  if(cpPlayer>=6) return '客席プレーヤー型';
  // topKey非LEAD かつ cp閾値未満 → 役割特化型
  if(topKey!=='LEAD'){
    var roleLabels2={'EDU':'育成','NUM':'数字分析','SYS':'仕組み化','REC':'採用','PR':'広報'};
    return '役割特化型（'+(roleLabels2[topKey]||topKey)+'で力が出やすい）';
  }
  // ── LEADトップ時の詳細判定 ──
  // 営業マネジメント転用候補（LEAD時もsimTop制限を適用）
  if(((leadScore>=58&&numScore>=43)||(cpMgmt>=5&&leadScore>=50))&&_simMgmt) return '営業マネジメント転用候補';
  if(leadScore>=50&&nonLeadMax>=42&&gap<=22) return '現場土台の拡張型';
  if(nNat>=bNat&&nNat>0&&(leadScore>=38||cpPlayer>=4)&&(eduScore>=35||cpTeach>=3)) return 'プレーヤー兼育成型';
  if(nNat>=bNat&&nNat>0&&(leadScore>=35||cpPlayer>=4)) return '客席プレーヤー型';
  if(bNat>nNat&&bNat>0&&leadScore>=52&&nonLeadMax<43) return 'フロア統率型';
  if(leadScore>=48&&nonLeadMax<36) return '現場特化型';
  return '現場適応型';
}
function detectHiddenPotential(sc){
  var rn=sc.rn,topKey=sc.topKey,secKey=sc.secKey;
  var roleLabels={EDU:'育成（人の成長を拾う観察眼がある）',NUM:'数字（営業の変化を数字で追う視点がある）',
    SYS:'仕組み化（繰り返しのトラブルを整理する目がある）',REC:'採用（人を見る目と定着への関心がある）',
    PR:'広報（店やキャストの魅力を発信する感性がある）',LEAD:'現場統率（店全体の流れを見て動ける力がある）'};
  var thresholds={EDU:33,NUM:33,SYS:33,REC:28,PR:28,LEAD:38};
  var potentials=[];
  var keys=['LEAD','EDU','NUM','SYS','REC','PR'];
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    if(k===topKey||k===secKey) continue;
    if((rn[k]||0)>=(thresholds[k]||28)) potentials.push(roleLabels[k]);
  }
  return potentials.length>0?potentials:null;
}

function buildFieldProfile(sc){
  var rn=sc.rn,nat=sc.nat,cp=sc.cp||{};
  var leadScore=rn['LEAD']||0,eduScore=rn['EDU']||0,numScore=rn['NUM']||0;
  var sysScore=rn['SYS']||0,recScore=rn['REC']||0,prScore=rn['PR']||0;
  var nonLeadMax=Math.max(eduScore,numScore,sysScore,recScore,prScore);
  var sorted=sc.sorted,topScore=sorted[0][1],secScore=sorted.length>1?sorted[1][1]:0,scoreGap=topScore-secScore;
  var nNat=nat['対人']||0,bNat=nat['現場']||0;
  // cp-based fit calculations
  var cpPlayer=(cp.player||0)+(cp.after||0)+(cp.contact||0)+(cp.mood||0);
  var cpRelationship=(cp.trust||0)+(cp.crm||0)+(cp.contact||0)+(cp.next||0);
  var cpAfterContact=(cp.after||0)+(cp.contact||0)+(cp.next||0);
  var cpTeach=cp.teach||0;
  var cpMgmt=(cp.mgmt||0)+(cp.next||0)+(cp.sales||0);
  var customerPlayerFit=cpPlayer>=6?'高':cpPlayer>=3?'中':'低';
  var relationshipBuildingFit=cpRelationship>=7?'高':cpRelationship>=4?'中':'低';
  var afterContactFit=cpAfterContact>=5?'高':cpAfterContact>=3?'中':'低';
  var playerToTeachingFit=cpTeach>=4?'高':cpTeach>=2?'中':'低';
  var currentFieldFit=leadScore>=62?'高':leadScore>=48?'中':'低';
  var playerFit=(nNat>=bNat&&nNat>0&&(leadScore>=38||cpPlayer>=4))?'高':(leadScore>=32||cpPlayer>=2?'中':'低');
  var playerToEducationFit=(nNat>=bNat&&(eduScore>=34||cpTeach>=3))?'高':(eduScore>=26||cpTeach>=2?'中':'低');
  var playerToManagementFit=(leadScore>=56&&numScore>=40)||(cpMgmt>=6&&leadScore>=46)?'高':(leadScore>=46&&numScore>=30||cpMgmt>=4?'中':'低');
  var expansionFit=(leadScore>=48&&nonLeadMax>=40&&scoreGap<=24)?'高':(leadScore>=40&&nonLeadMax>=32?'中':'低');
  var stayFieldFit=(leadScore>=56&&nonLeadMax<43)?'高':(leadScore>=46&&nonLeadMax<38?'中':'低');

function checkAnswerQuality(sc,ans){
  var flags=[];
  var va=ans.filter(function(a){return a!==null&&a!==undefined;});
  var n=va.length;
  // 1. 周期4パターン（A/B/C/Dを機械的に繰り返し）
  if(n>=12){
    var cyc=0;
    for(var i=4;i<n;i++){if(va[i]===va[i%4]) cyc++;}
    if(cyc>=n-4-2) flags.push('periodic');
  }
  // 2. 同一選択肢が8回以上連続
  var maxRun=1,run=1;
  for(var i=1;i<n;i++){
    if(va[i]===va[i-1]) run++; else run=1;
    if(run>maxRun) maxRun=run;
  }
  if(maxRun>=8) flags.push('consecutive');
  // 3. 役割スコア1位〜3位の差が8pt以内（平坦すぎる）
  var s=sc.sorted;
  if(s.length>=3&&s[0][1]-s[2][1]<=8) flags.push('flat_scores');
  // 4. P3なのに回答一貫性が「高（3層一致）」
  if(sc.hantei==='P3'&&sc.trust&&sc.trust.indexOf('高（3層')>=0) flags.push('p3_high_trust');
  // 5. 1位スコアが低く明確な役割仮説なし
  if(sc.topScore<38) flags.push('low_score');
  return{warn:flags.length>=1,flags:flags};
}
// ── 近接タイプ検索 ──
function findAdjacentType(sc){
  var sorted=sc.sorted;
  if(!sc.typeKey||sorted.length<3) return null;
  var t=sc.topKey,s=sc.secKey,th=sorted[2][0];
  // 3位スコアが2位との差15pt超なら近接扱いしない
  var sScore=sorted.length>1?sorted[1][1]:0,thScore=sorted[2][1];
  if(sScore-thScore>15) return null;
  var candidates=[t+'-'+th,th+'-'+t,s+'-'+th,th+'-'+s];
  for(var i=0;i<candidates.length;i++){
    if(TYPES[candidates[i]]&&candidates[i]!==sc.typeKey)
      return{key:candidates[i],typeObj:TYPES[candidates[i]],thirdKey:th,thirdScore:Math.round(thScore)};
  }
  return null;
}

        '<div style="font-size:12px;color:var(--amb);margin-bottom:4px">'+sc.wf+'</div>'+
        '<div style="font-size:10px;color:var(--text3);line-height:1.6">'+wfMsg+'</div>'+wfConflictMsg+'</div>';
  }
  var strMax=Math.max.apply(null,Object.values(sc.str))||1;
  var strLabels={
    REL:'人間関係で気を使うストレス',
    AMB:'やることが曖昧なストレス',
    NUM_S:'やった結果が見えないストレス',
    FREE:'自分で決められないストレス',
    OVER:'一人で抱えすぎるストレス'
  };
  var strDescs={
    REL:'空気が悪い職場や、言い方がきつい人が多い環境だと疲れやすいタイプです。',
    AMB:'「何をすればいいかよくわからない」状態が続くと、やる気が下がりやすいタイプです。',
    NUM_S:'頑張っているのに結果がどう出ているか見えないと、続けるのがしんどくなりやすいタイプです。',
    FREE:'自分で考えて動きたいのに、細かく決められすぎるとやる気が落ちやすいタイプです。',
    OVER:'忙しくなると、人に頼る前に自分で何とかしようとして疲れやすいタイプです。'
  };
  function strLevel(sv,mx){if(sv/mx>=0.7) return'強め';if(sv/mx>=0.35) return'ややあり';return'低め';}
  sb+='<div class="shachi-box"><div class="s-title">ストレスがたまりやすい場面</div>';
  var strSorted=Object.keys(sc.str).sort(function(a,b){return sc.str[b]-sc.str[a];});
  for(var i=0;i<Math.min(3,strSorted.length);i++){
    var sv=sc.str[strSorted[i]]||0;if(sv===0) continue;
    var pct=Math.round(sv/strMax*100);
    var lvl=strLevel(sv,strMax);
    var lvlColor=lvl==='強め'?'var(--red)':lvl==='ややあり'?'var(--amb)':'var(--mid)';
    sb+='<div class="stress-row2">'+
        '<div class="stress-head">'+
          '<div class="stress-label2">'+strLabels[strSorted[i]]+'</div>'+
          '<div class="stress-lv" style="color:'+lvlColor+'">'+lvl+'</div>'+
        '</div>'+
        '<div class="stress-bar-wrap"><div class="stress-bar" style="width:'+pct+'%"></div></div>'+
        '<div class="stress-desc">'+strDescs[strSorted[i]]+'</div>'+
        '</div>';
  }
  sb+='</div>';
  document.getElementById('sbox').innerHTML=sb;
  showOnly('s-result');
}

// 👇 本番公開時は SECTION A の DPS_CONFIG.env を 'prod' に変更するだけです
var WEBHOOK_URL=DPS_CONFIG.webhookUrl;
function sendResult(){
  var name=document.getElementById('send-name').value.trim();
  var store=document.getElementById('send-store').value.trim();
  var _vErr=validateSendForm(name,store);
  if(_vErr){document.getElementById('send-status').textContent=_vErr;return;}
  var sc=lastSc;
  var roleNames={LEAD:'統率・現場',EDU:'育成・教育',NUM:'戦略・数字',SYS:'整理・仕組み化',REC:'求人・採用',PR:'広報・PR'};
  var abilityNames={'対人':'対人運用力','現場':'現場統率力','分析':'分析・構造化力','表現':'表現・訴求力'};
  var sorted=sc.sorted||[];
  var top1=sorted[0]?roleNames[sorted[0][0]]+'('+Math.round(sorted[0][1])+'pt)':'-';
  var top2=sorted[1]?roleNames[sorted[1][0]]+'('+Math.round(sorted[1][1])+'pt)':'-';
  var ty=TYPES[sc.typeKey]||{};
  var roleScores={};
  if(sc.sorted){for(var i=0;i<sc.sorted.length;i++){roleScores[roleNames[sc.sorted[i][0]]]=Math.round(sc.sorted[i][1]);}}
  var allAnswers={};
  for(var i=0;i<TOTAL;i++){
    var q=QS[i];var a=ans[i];var letters=['A','B','C','D'];
    allAnswers['Q'+(i+1)]=(a!==null&&a!==undefined&&q.ch[a])?letters[a]+': '+q.ch[a].t:'未回答';
  }
  var stressTop=(function(){
    var st=sc.str||{};var best=null,bestV=-1;
    var stNames={REL:'人間関係',AMB:'曖昧さ',NUM_S:'結果不明',FREE:'裁量不足',OVER:'抱え込み'};
    for(var k in st){if((st[k]||0)>bestV){bestV=st[k];best=k;}}
    return best?stNames[best]:'-';
  })();
  var payload={
    name:name,store:store,date:new Date().toLocaleDateString('ja-JP'),
    type:ty.role||sc.typeKey||'準タイプ',hantei:sc.hantei,hantei_label:HANTEI_LABEL[sc.hantei]||sc.hantei,
    top_role:top1,second_role:top2,
    natural_top:abilityNames[sc.ntTop]||sc.ntTop,
    claimed_top:abilityNames[sc.clTop]||sc.clTop,
    behavior_sim:abilityNames[sc.simTop]||sc.simTop,
    trust:sc.trust,gap:sc.gap?'あり':'なし',
    eval_flag:sc.ef,ea_score:sc.ea,weakness_flag:sc.wf||'なし',stress_top:stressTop,
    role_scores:JSON.stringify(roleScores),all_answers:JSON.stringify(allAnswers),
    field_subtype:sc.fieldProfile.fieldSubtype,
    hidden_potential:sc.fieldProfile.hiddenPotential,
    stay_field_fit:sc.fieldProfile.stayFieldFit,
    expansion_fit:sc.fieldProfile.expansionFit,
    player_fit:sc.fieldProfile.playerFit,
    player_to_education_fit:sc.fieldProfile.playerToEducationFit,
    player_to_management_fit:sc.fieldProfile.playerToManagementFit,
    first_small_role:sc.fieldProfile.firstSmallRole,
    trust_comment:buildTrustComment(sc).replace(/<[^>]+>/g,' '),
    result_reason:buildResultReason(sc).replace(/<[^>]+>/g,' '),
    suitable_tasks:(ROLE_TASKS[sc.topKey]||[]).join(' / '),
    unsuitable_assignment:buildUnsuitableAssignment(sc),
    first_small_steps:(ROLE_FIRST_STEPS[sc.topKey]||[]).join(' / '),
    customer_player_fit:sc.fieldProfile.customerPlayerFit,
    relationship_building_fit:sc.fieldProfile.relationshipBuildingFit,
    after_contact_fit:sc.fieldProfile.afterContactFit,
    player_to_teaching_fit:sc.fieldProfile.playerToTeachingFit,
    customer_response_scores:JSON.stringify(sc.cp||{})
  };
  var btn=document.getElementById('btn-send');
  var status=document.getElementById('send-status');
  btn.disabled=true;status.style.color='var(--mid)';status.textContent='送信中...';
  fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
  .then(function(res){
    if(res.ok){status.style.color='var(--teal)';status.textContent='✓ 送信が完了しました。ありがとうございました。';}
    else{throw new Error('HTTP '+res.status);}
  })
  .catch(function(err){
    status.style.color='var(--red)';status.textContent='送信に失敗しました。もう一度試すか、管理者に連絡してください。';
    btn.disabled=false;console.error('送信エラー:',err);
  });
}

function validateSendForm(name,store){
  if(!name) return '氏名を入力してください';
  if(!store) return '店舗を入力してください';
  if(!lastSc) return '診断結果がありません。診断を完了してください';

}

  }
  if(sc.wf&&!sc.wfConflict) flags.push({t:'fi',n:'弱点フラグあり（'+sc.wf+'）',d:'後回しにしやすい傾向はあるが、主役割との衝突は軽微。現場観察で確認する程度で問題ない。'});
  if(flags.length===0) flags.push({t:'fi',n:'フラグなし',d:'現時点で注意フラグは検出されていません。面談は通常の内容で問題ありません。'});
  h+='<div class="ad-sec"><div class="ad-sec-title">注意フラグ（'+flags.length+'件）</div>';
  for(var i=0;i<flags.length;i++){
    h+='<div class="flag-item"><div class="flag-icon '+flags[i].t+'">'+(flags[i].t==='fw'?'!':flags[i].t==='fc'?'△':'✓')+'</div>'+
       '<div><div class="flag-name">'+flags[i].n+'</div><div class="flag-desc">'+flags[i].d+'</div></div></div>';
  }
  h+='</div>';
  var actions=['「最近、一番力が出た仕事の場面を教えてください」'];
  if(sc.gap) actions.push('「'+abilityNames[sc.simTop]+'の仕事をしている時の気持ちを聞く（乖離の確認）」');
  if(sc.ef>=2) actions.push('「評価された時に伸びる仕事と、評価がなくても続けられる仕事はそれぞれ何ですか？」');
  if(sc.ea>=3) actions.push('「自分が今週から変えられることを一つ挙げるとしたら？」');
  if(sc.wf) actions.push('「'+sc.wf+'の状況が続いた時、何が一番しんどいですか？」');
  h+='<div class="ad-sec"><div class="act-title">面談で確認すること</div>';
  for(var i=0;i<actions.length;i++) h+='<div class="act-item">'+actions[i]+'</div>';
  h+='</div>';
  // ── 現場プロファイル詳細（管理側）──
  var fp2=lastSc.fieldProfile;
  var md=fp2.managerData;
  var fitCls=function(v){return v==='高'?'fit-high':v==='中'?'fit-mid':'fit-low';};
  var adminProfileTitle=sc.topKey==='LEAD'?'現場プロファイル詳細':'配置・伸ばし方プロファイル詳細';
  h+='<div class="ad-sec"><div class="ad-sec-title">'+adminProfileTitle+'</div>';
  h+='<div class="field-subtype-badge">'+md.fieldSubtype+'</div>';
  h+='<div class="field-fit-grid">';
  h+='<div class="field-fit-card"><div class="field-fit-lbl">現場適合度</div><div class="field-fit-val '+fitCls(fp2.currentFieldFit)+'">'+fp2.currentFieldFit+'</div></div>';
  h+='<div class="field-fit-card"><div class="field-fit-lbl">現場維持推奨</div><div class="field-fit-val '+fitCls(fp2.stayFieldFit)+'">'+fp2.stayFieldFit+'</div></div>';
  h+='<div class="field-fit-card"><div class="field-fit-lbl">役割拡張適性</div><div class="field-fit-val '+fitCls(fp2.expansionFit)+'">'+fp2.expansionFit+'</div></div>';
  h+='<div class="field-fit-card"><div class="field-fit-lbl">プレーヤー適性</div><div class="field-fit-val '+fitCls(fp2.playerFit)+'">'+fp2.playerFit+'</div></div>';
  h+='<div class="field-fit-card"><div class="field-fit-lbl">育成転用可能性</div><div class="field-fit-val">'+md.playerToEdu+'</div></div>';
  h+='<div class="field-fit-card"><div class="field-fit-lbl">営業MG転用可能性</div><div class="field-fit-val">'+md.playerToMgmt+'</div></div>';
  h+='</div>';
  h+='<div style="margin-top:10px"><div style="font-size:9px;letter-spacing:.2em;color:var(--lit);margin-bottom:4px">現在使える力</div>';
  h+='<div style="font-size:11px;color:var(--dark);line-height:1.75">・'+md.currentUsage.replace(/ \/ /g,'<br>・')+'</div></div>';
  if(md.hiddenPotentialList&&md.hiddenPotentialList.length>0){
    h+='<div style="margin-top:10px"><div style="font-size:9px;letter-spacing:.2em;color:var(--amb);margin-bottom:4px">隠れ適性（面談で確認）</div>';
    h+='<div style="font-size:11px;color:var(--dark);line-height:1.75">・'+md.hiddenPotentialList.join('<br>・')+'</div></div>';
  }
  h+='<div style="margin-top:10px"><div style="font-size:9px;letter-spacing:.2em;color:var(--teal);margin-bottom:4px">最初に任せる小さな役割</div>';
  h+='<div style="font-size:11px;color:var(--dark);line-height:1.75">・'+md.firstSmallRole.replace(/ \/ /g,'<br>・').replace(/ \+ /g,'<br>・')+'</div></div>';
  h+='<div style="margin-top:10px"><div style="font-size:9px;letter-spacing:.2em;color:var(--red);margin-bottom:4px">任せると危ない役割</div>';
  h+='<div style="font-size:11px;color:var(--dark);line-height:1.75">・'+md.dangerRole.replace(/ \/ /g,'<br>・')+'</div></div>';
  h+='<div style="margin-top:10px"><div class="act-title">現場プロファイルの面談確認ポイント</div>';
  for(var pi=0;pi<md.interviewPoints.length;pi++) h+='<div class="act-item">'+md.interviewPoints[pi]+'</div>';
  h+='</div></div>';
  h+='<div class="warn-box" style="margin-top:12px"><strong>【再確認】この診断はあくまで仮説ツールです</strong><br>面談と現場観察を必ず経てから最終配置判断をしてください。<br>※ このHTMLファイルはブラウザのソース表示で誰でも閲覧できます。管理者パスワードのハッシュも含め、重要な秘匿情報はこのファイルに含めないでください。ファイルの配布管理を徹底してください。</div>';
  document.getElementById('admcont').innerHTML=h;
}
</script>
</body>
</html>
